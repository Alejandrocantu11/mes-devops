apiVersion: apps/v1
kind: Deployment
metadata:
  name: mes-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mes
  template:
    metadata:
      labels:
        app: mes
    spec:
      containers:
        - name: mes-container
          image: mes-devops:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: DB_USER
              value: "postgres"
            - name: DB_HOST
              value: "host.minikube.internal"
            - name: DB_NAME
              value: "mes_db"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mes-db-secret
                  key: password
            - name: DB_PORT
              value: "5432"